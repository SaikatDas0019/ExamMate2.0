<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <button onclick="window.history.back()" style="background: transparent; border: none; color: inherit; font-size: 1.1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 1rem; font-weight: 600;">
    <i class="fas fa-arrow-left"></i> Back
    </button>
    <title>ExamMate | Setup Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { color-scheme: dark; }
        body {
            background-color: #05070f; background: linear-gradient(180deg, #08101f 0%, #04060d 100%);
            color: #e8eef8; font-family: 'Segoe UI', sans-serif;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .setup-card {
            background: rgba(17, 29, 52, 0.8); border-radius: 20px; padding: 40px;
            width: 100%; max-width: 400px; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(34, 192, 93, 0.3); text-align: center;
        }
        .setup-card h2 { margin-top: 0; color: #fff; font-size: 1.6rem; }
        .setup-card p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; }
        
        /* Profile Picture Customization */
        .profile-pic-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        .profile-img-preview { 
            width: 100px; height: 100px; border-radius: 50%; 
            border: 3px solid #22c55e; object-fit: cover;
            background-color: #111d34;
        }
        .upload-btn {
            position: absolute; bottom: 0; right: 0;
            background: #3b82f6; color: white; border-radius: 50%;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 3px solid #08101f; transition: 0.3s;
        }
        .upload-btn:hover { background: #2563eb; transform: scale(1.1); }
        #file-upload { display: none; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; box-sizing: border-box; outline: none;
        }
        .form-group input[readonly] { color: #64748b; cursor: not-allowed; }
        
        .btn-submit {
            width: 100%; background: #22c55e; color: #fff; border: none; padding: 14px;
            border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;
            margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2);
        }
        .btn-submit:hover { background: #16a34a; }
        
        /* Loading Overlay */
        #loading-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 15, 0.8); border-radius: 20px;
            align-items: center; justify-content: center; color: #22c55e; flex-direction: column;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #22c55e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="setup-card" style="position: relative;">
        <h2>Complete Your Profile</h2>
        <p>Just one more step to get started!</p>
        
        <!-- Profile Picture Upload Area -->
        <div class="profile-pic-container">
            <img id="preview-img" src="https://ui-avatars.com/api/?name=User&background=random" class="profile-img-preview" alt="Profile">
            <label for="file-upload" class="upload-btn" title="Upload Custom Photo">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="file-upload" accept="image/png, image/jpeg, image/jpg" onchange="previewImage(event)">
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="input-name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="input-email" readonly>
        </div>

        <div class="form-group">
            <label>I am a...</label>
            <select id="input-role">
                <option value="Student">Student (Learn & Practice)</option>
                <option value="Teacher">Teacher (Create Exams)</option>
            </select>
        </div>

        <button class="btn-submit" onclick="finishSetup()">Let's Go 🚀</button>

        <!-- Loading Animation -->
        <div id="loading-overlay">
            <div class="spinner"></div>
            <span style="font-weight: 600;">Setting up your account...</span>
        </div>
    </div>

    <script>
        let tempUser = {};
        let imageFileToUpload = null;
        
        // পেজ লোড হলে গুগলের ডাটা ফর্ম-এ বসানো
        window.onload = () => {
            const data = localStorage.getItem('temp_user');
            if(!data) {
                window.location.href = '/'; 
                return;
            }
            tempUser = JSON.parse(data);
            
            document.getElementById('input-name').value = tempUser.name || "";
            document.getElementById('input-email').value = tempUser.email || "";
            if(tempUser.photo_url) {
                document.getElementById('preview-img').src = tempUser.photo_url;
            }
        };

        // নতুন ছবি সিলেক্ট করলে প্রিভিউ দেখানো
        function previewImage(event) {
            if(event.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function() {
                    document.getElementById('preview-img').src = reader.result;
                }
                reader.readAsDataURL(event.target.files[0]);
                imageFileToUpload = event.target.files[0];
            }
        }

        // ফর্ম সাবমিট করা
        async function finishSetup() {
            const finalName = document.getElementById('input-name').value.trim();
            const role = document.getElementById('input-role').value;

            if(!finalName) {
                alert("Please enter your name."); return;
            }

            // লোডিং স্ক্রিন চালু করা
            document.getElementById('loading-overlay').style.display = 'flex';

            const payload = {
                email: tempUser.email,
                name: finalName,
                role: role,
                photo_url: tempUser.photo_url // ডিফল্ট গুগলের ছবি
            };

            try {
                // ১. অ্যাকাউন্ট ক্রিয়েট করা
                const res = await fetch('/api/complete-signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if(data.success) {
                    
                    // ২. যদি ইউজার নতুন কোনো ছবি আপলোড করে থাকে, তবে সেটি সেভ করা
                    if (imageFileToUpload) {
                        const formData = new FormData();
                        formData.append('email', tempUser.email);
                        formData.append('action', 'upload');
                        formData.append('file', imageFileToUpload);
                        await fetch('/api/upload-profile-pic', { method: 'POST', body: formData });
                    }

                    // ৩. লোকাল স্টোরেজে ডাটা সেভ করে ড্যাশবোর্ডে রিডাইরেক্ট
                    localStorage.setItem('user', JSON.stringify({
                        email: payload.email, 
                        name: payload.name, 
                        role: payload.role
                    }));
                    localStorage.setItem('userName', payload.name);
                    localStorage.setItem('userEmail', payload.email);
                    localStorage.removeItem('temp_user'); // টেম্পোরারি ডাটা মুছে ফেলা
                    
                    window.location.href = data.redirect_url;
                } else {
                    document.getElementById('loading-overlay').style.display = 'none';
                    alert("Error creating account: " + data.error);
                }
            } catch(err) {
                document.getElementById('loading-overlay').style.display = 'none';
                console.error(err);
                alert("Something went wrong!");
            }
        }
    </script>
</body>
</html>
