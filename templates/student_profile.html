<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Student Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { color-scheme: light; }
        body { background-color: #f9fafb; color: #333333; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background-color: #ffffff; min-height: 100vh; padding: 0 1.5rem 6rem 1.5rem; box-sizing: border-box; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        /* Fixed Sticky Header Style */
        .sticky-header {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            z-index: 999;
            padding: 1rem 0 0.8rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Fixed Back Button Style ("‹") */
        .btn-back {
            background: transparent;
            border: none;
            color: #111827;
            font-size: 2.2rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 0.8;
            padding: 0;
        }

        .page-title { font-size: 1.5rem; font-weight: 800; margin: 0; color: #111827; flex: 1; }
        
        /* Avatar Style (Initials) */
        .avatar-container { display: flex; justify-content: center; margin-bottom: 25px; }
        .avatar-circle { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: bold; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); text-transform: uppercase; }

        .edit-form-group { margin-bottom: 15px; text-align: left; }
        .edit-form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #4b5563; margin-bottom: 5px; }
        .edit-form-group input, .edit-form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        .edit-form-group input[readonly] { background: #f1f5f9; color: #64748b; cursor: not-allowed; }
        
        .btn-save-profile { width: 100%; background: #22c55e; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 6px rgba(34, 197, 94, 0.2); }
        .btn-save-profile:hover { background: #16a34a; }

        .btn-logout { width: 100%; background: #ef4444; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 15px; transition: 0.2s; box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2); }
        .btn-logout:hover { background: #dc2626; }

        hr { border: 0; border-top: 1px solid #e5e7eb; margin: 2rem 0; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #1f2937; margin-bottom: 1rem; }
        .teachers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .teacher-btn { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 10px 5px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-align: center; cursor: default; }

        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ffffff; border-top: 1px solid #e5e7eb; padding: 8px 0; z-index: 1000; display: flex; justify-content: space-around; box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #6b7280; font-size: 0.75rem; cursor: pointer; flex: 1; font-weight: 600;}
        .nav-item.active { color: #3b82f6; font-weight: bold; }
        .nav-icon { font-size: 1.2rem; margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ফিক্সড হেডার এবং "‹" ব্যাক বাটন -->
        <div class="sticky-header">
            <button class="btn-back" onclick="window.history.back()">&nbsp; ‹ &nbsp;</button>

            <div class="page-title">Profile Settings</div>
        </div>

        <!-- Avatar Section (Initials) -->
        <div class="avatar-container">
            <div class="avatar-circle" id="user-avatar">S</div>
        </div>

        <div class="user-info-form">
            <div class="edit-form-group">
                <label>👤 Name (You can change)</label>
                <input type="text" id="input-name" placeholder="Enter full name">
            </div>
            <div class="edit-form-group">
                <label>📧 Email (Cannot be changed)</label>
                <input type="email" id="input-email" readonly>
            </div>
            <div class="edit-form-group">
                <label>🎓 Role (Account Type)</label>
                <select id="input-role">
                    <option value="Student" selected>Student</option>
                    <option value="Teacher">Teacher (Switch Account)</option>
                </select>
            </div>

            <button type="button" class="btn-save-profile" onclick="saveProfileChanges()">Save Changes 💾</button>
            <button type="button" class="btn-logout" onclick="handleLogout()">🚪 Logout</button>
        </div>

        <hr>
        <div class="section-title">My Favourite Teachers</div>
        <div class="teachers-grid">
            <div class="teacher-btn">Tarapada Sir</div>
            <div class="teacher-btn">Prokash Sir</div>
            <div class="teacher-btn">Somnath Sir</div>
            <div class="teacher-btn">Amit Sir</div>
            <div class="teacher-btn">Manash Sir</div>
            <div class="teacher-btn">Mithun Sir</div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='/student_dashboard.html'">
            <div class="nav-icon"><i class="fas fa-home"></i></div>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="window.location.href='/student_resources.html'">
            <div class="nav-icon"><i class="fas fa-folder-open"></i></div>
            <span>Resources</span>
        </div>
        <div class="nav-item" onclick="window.location.href='/student_analytics.html'">
            <div class="nav-icon"><i class="fas fa-chart-bar"></i></div>
            <span>Analytics</span>
        </div>
        <div class="nav-item active" onclick="window.location.href='/student_profile.html'">
            <div class="nav-icon"><i class="far fa-user"></i></div>
            <span>Profile</span>
        </div>
    </div>

    <script>
        function setAvatarInitials(name) {
            const avatar = document.getElementById('user-avatar');
            if(name) {
                const parts = name.trim().split(' ');
                if(parts.length > 1) {
                    avatar.innerText = (parts[0][0] + parts[1][0]).toUpperCase();
                } else {
                    avatar.innerText = parts[0][0].toUpperCase();
                }
            }
        }

        function loadUserProfile() {
            let userObj = JSON.parse(localStorage.getItem('user')) || {};
            let userEmail = userObj.email || localStorage.getItem('userEmail') || "";
            let userName = userObj.name || localStorage.getItem('userName') || "Student";

            document.getElementById('input-name').value = userName;
            document.getElementById('input-email').value = userEmail;
            setAvatarInitials(userName);
        }

        async function saveProfileChanges() {
            const name = document.getElementById('input-name').value.trim();
            const email = document.getElementById('input-email').value.trim();
            const role = document.getElementById('input-role').value;

            if (!name || !email) { alert("Name missing!"); return; }

            try {
                const response = await fetch('/api/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, name: name, role: role })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    let userObj = JSON.parse(localStorage.getItem('user')) || {};
                    userObj.email = email; userObj.name = name; userObj.role = role;
                    localStorage.setItem('user', JSON.stringify(userObj));
                    localStorage.setItem('userName', name);
                    setAvatarInitials(name);
                    alert("Profile updated successfully!");
                    if (data.redirect_url) { window.location.href = data.redirect_url; }
                } else { alert(data.error || "Failed to update profile."); }
            } catch (error) { alert("Server error updating profile."); }
        }

        function handleLogout() {
            if (confirm("Are you sure you want to log out?")) {
                localStorage.clear(); sessionStorage.clear(); window.location.href = '/logout';
            }
        }

        window.onload = loadUserProfile;
    </script>
</body>
</html>
