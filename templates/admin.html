<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { color-scheme: light; }
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-container { background: #ffffff; width: 100%; max-width: 450px; min-height: 90vh; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); padding: 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; position: relative; }
        .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .admin-header h1 { font-size: 1.4rem; margin: 0; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .back-menu-btn { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 10px; font-weight: bold; color: #3b82f6; cursor: pointer; display: none; }

        /* MAIN DASHBOARD BUTTONS */
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .admin-card { background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); border: 1px solid #e2e8f0; border-radius: 18px; padding: 22px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .admin-card:hover { transform: translateY(-4px); border-color: #3b82f6; }
        .card-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; margin-bottom: 10px; color: white; }
        .card-notif .card-icon { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .card-drive .card-icon { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }

        .panel-view { display: none; flex: 1; flex-direction: column; }
        .panel-view.active { display: flex; }

        /* DRIVE VIEW */
        .drive-breadcrumb { font-size: 0.85rem; color: #3b82f6; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .drive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .folder-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 14px; padding: 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .folder-card span { font-size: 0.9rem; font-weight: bold; color: #1e3a8a; }

        .file-list { display: flex; flex-direction: column; gap: 10px; }
        .file-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }

        /* Floating Plus Button */
        .fab-plus { position: absolute; bottom: 20px; right: 20px; width: 56px; height: 56px; background: #3b82f6; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.4); cursor: pointer; transition: 0.2s; }
        .fab-plus:hover { transform: scale(1.08); }

        /* Modal Popup Options */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: white; width: 90%; max-width: 380px; padding: 20px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); box-sizing: border-box; }
        .modal-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #0f172a; }
        .modal-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: bold; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
        .modal-btn:hover { background: #f1f5f9; border-color: #3b82f6; }

        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.9rem; outline: none; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #22c55e; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* NOTIFICATION UI */
        .chat-feed { flex: 1; padding: 10px; overflow-y: auto; background: #f8fafc; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 380px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .msg-bubble { background: #3b82f6; color: white; padding: 10px; border-radius: 12px; align-self: flex-end; max-width: 85%; font-size: 0.88rem; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1 id="admin-title"><i class="fas fa-user-shield"></i> Admin Panel</h1>
            <button class="back-menu-btn" id="back-btn" onclick="showDashboardMenu()"><i class="fas fa-th-large"></i> Menu</button>
        </div>

        <!-- MAIN DASHBOARD (2 BUTTONS) -->
        <div id="dashboard-menu">
            <div class="admin-grid">
                <div class="admin-card card-notif" onclick="openPanel('notif-panel', '📢 Send Notification')">
                    <div class="card-icon"><i class="fas fa-bullhorn"></i></div>
                    <div class="card-title">Notification</div>
                    <div class="card-desc">Broadcast Messages</div>
                </div>

                <div class="admin-card card-drive" onclick="openPanel('drive-panel', '📂 Drive Manager')">
                    <div class="card-icon"><i class="fas fa-folder-open"></i></div>
                    <div class="card-title">Drive Manager</div>
                    <div class="card-desc">Manage Folders & Files</div>
                </div>
            </div>
        </div>

        <!-- NOTIFICATION PANEL -->
        <div id="notif-panel" class="panel-view">
            <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;">
                <label>Target:</label>
                <select id="target-role" style="padding: 6px; border-radius: 6px;">
                    <option value="All">All Users</option>
                    <option value="Student">Students Only</option>
                </select>
            </div>
            <div class="chat-feed" id="chat-feed"></div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="notif-message" style="flex:1; padding:10px; border-radius:10px; border:1px solid #cbd5e1;" placeholder="Type message...">
                <button onclick="submitNotification()" style="background:#3b82f6; color:white; border:none; padding:10px 15px; border-radius:10px;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- GOOGLE DRIVE STYLE MANAGER PANEL -->
        <div id="drive-panel" class="panel-view">
            <div class="drive-breadcrumb" id="drive-breadcrumb">
                <i class="fas fa-folder"></i> <span id="current-path">Root Folder</span>
            </div>

            <button id="up-folder-btn" style="display:none; margin-bottom:10px; background:#e2e8f0; border:none; padding:6px 10px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="navigateUp()"><i class="fas fa-arrow-up"></i> Go Back</button>

            <!-- Folders List -->
            <div class="drive-grid" id="drive-folder-container"></div>

            <!-- Files List -->
            <div class="file-list" id="drive-file-container"></div>

            <!-- Floating Plus Button -->
            <div class="fab-plus" onclick="openPlusModal()"><i class="fas fa-plus"></i></div>
        </div>

    </div>

    <!-- 1. MAIN OPTIONS MODAL -->
    <div class="modal-overlay" id="plus-modal">
        <div class="modal-box">
            <div class="modal-title">Create or Upload</div>
            <button class="modal-btn" onclick="openFolderModal()"><i class="fas fa-folder-plus" style="color:#f59e0b;"></i> New Folder</button>
            <button class="modal-btn" onclick="openUploadModal()"><i class="fas fa-file-upload" style="color:#22c55e;"></i> Upload File</button>
            <button class="modal-btn" style="color:#ef4444;" onclick="closeAllModals()">Cancel</button>
        </div>
    </div>

    <!-- 2. UPLOAD FILE MODAL (FIXED) -->
    <div class="modal-overlay" id="upload-file-modal">
        <div class="modal-box">
            <div class="modal-title">Upload File to Drive 📄</div>
            <form id="file-upload-form" onsubmit="submitDriveFileUpload(event)">
                <div class="form-group">
                    <label>File Title / Chapter Name</label>
                    <input type="text" id="upload-file-title" placeholder="e.g. Chapter 1 Notes" required>
                </div>
                <div class="form-group">
                    <label>Content Type</label>
                    <select id="upload-file-type" required>
                        <option value="Notes">Notes 📑</option>
                        <option value="Short Notes">Short Notes 📝</option>
                        <option value="Mind Map">Mind Map 🧠</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select File (PDF / Image)</label>
                    <input type="file" id="upload-file-input" accept=".pdf,.doc,.docx,.png,.jpg" required>
                </div>
                <button type="submit" class="btn-submit" id="upload-file-submit-btn">Upload Now 🚀</button>
                <button type="button" class="modal-btn" style="margin-top:8px; text-align:center;" onclick="closeAllModals()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        let currentFolderId = 0; // 0 = Root Folder
        let folderHistory = [];

        function openPanel(panelId, titleText) {
            document.getElementById('dashboard-menu').style.display = 'none';
            document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            document.getElementById('admin-title').innerHTML = titleText;
            document.getElementById('back-btn').style.display = 'block';

            if (panelId === 'drive-panel') loadDriveContents();
            if (panelId === 'notif-panel') loadNotifications();
        }

        function showDashboardMenu() {
            document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
            document.getElementById('dashboard-menu').style.display = 'block';
            document.getElementById('admin-title').innerHTML = '<i class="fas fa-user-shield"></i> Admin Panel';
            document.getElementById('back-btn').style.display = 'none';
        }

        // --- DRIVE MANAGER LOGIC ---
        async function loadDriveContents() {
            const folderBox = document.getElementById('drive-folder-container');
            const fileBox = document.getElementById('drive-file-container');
            folderBox.innerHTML = 'Loading...'; fileBox.innerHTML = '';

            try {
                const res = await fetch('/api/admin/get-drive-contents', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ parent_id: currentFolderId })
                });
                const data = await res.json();

                if (data.success) {
                    folderBox.innerHTML = ''; fileBox.innerHTML = '';

                    data.folders.forEach(f => {
                        folderBox.innerHTML += `
                            <div class="folder-card" onclick="openDriveFolder(${f.id}, '${f.name}')">
                                <div><i class="fas fa-folder" style="color:#3b82f6; margin-right:6px;"></i> <span>${f.name}</span></div>
                                <i class="fas fa-trash" style="color:#ef4444; cursor:pointer;" onclick="deleteDriveItem(event, 'folder', ${f.id})"></i>
                            </div>
                        `;
                    });

                    data.files.forEach(file => {
                        fileBox.innerHTML += `
                            <div class="file-card">
                                <div><i class="fas fa-file-pdf" style="color:#ef4444; margin-right:8px;"></i> <strong>${file.title}</strong></div>
                                <div style="display:flex; gap:10px;">
                                    <a href="${file.file_url}" target="_blank" style="color:#3b82f6;"><i class="fas fa-eye"></i></a>
                                    <i class="fas fa-trash" style="color:#ef4444; cursor:pointer;" onclick="deleteDriveItem(event, 'file', ${file.id})"></i>
                                </div>
                            </div>
                        `;
                    });

                    if(data.folders.length === 0 && data.files.length === 0) {
                        folderBox.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem; grid-column:span 2;">Empty Folder. Click + to add.</p>';
                    }
                }
            } catch(e) { console.error(e); }
        }

        function openDriveFolder(folderId, folderName) {
            folderHistory.push({ id: currentFolderId, name: document.getElementById('current-path').innerText });
            currentFolderId = folderId;
            document.getElementById('current-path').innerText = folderName;
            document.getElementById('up-folder-btn').style.display = 'block';
            loadDriveContents();
        }

        function navigateUp() {
            if (folderHistory.length > 0) {
                const prev = folderHistory.pop();
                currentFolderId = prev.id;
                document.getElementById('current-path').innerText = prev.name;
                if(folderHistory.length === 0) document.getElementById('up-folder-btn').style.display = 'none';
                loadDriveContents();
            }
        }

        /* --- MODAL CONTROL FUNCTIONS --- */
        function openPlusModal() { document.getElementById('plus-modal').style.display = 'flex'; }
        function openUploadModal() { 
            closeAllModals(); 
            document.getElementById('upload-file-modal').style.display = 'flex'; 
        }
        function openFolderModal() {
            closeAllModals();
            setTimeout(showCreateFolderPrompt, 100);
        }
        function closeAllModals() {
            document.getElementById('plus-modal').style.display = 'none';
            document.getElementById('upload-file-modal').style.display = 'none';
        }

        async function showCreateFolderPrompt() {
            const name = prompt("Enter New Folder Name:");
            if (name) {
                await fetch('/api/admin/create-drive-folder', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ folder_name: name, parent_id: currentFolderId })
                });
                loadDriveContents();
            }
        }

        /* --- PROPER FILE UPLOAD SUBMIT FUNCTION --- */
        async function submitDriveFileUpload(e) {
            e.preventDefault();
            const title = document.getElementById('upload-file-title').value;
            const resType = document.getElementById('upload-file-type').value;
            const fileInput = document.getElementById('upload-file-input');
            const submitBtn = document.getElementById('upload-file-submit-btn');

            if (!fileInput.files[0]) {
                alert("Please choose a file first!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Uploading File...";

            const formData = new FormData();
            formData.append('title', title);
            formData.append('resource_type', resType);
            formData.append('folder_id', currentFolderId);
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/admin/upload-drive-file', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    alert("🎉 File uploaded successfully!");
                    document.getElementById('file-upload-form').reset();
                    closeAllModals();
                    loadDriveContents();
                } else {
                    alert(data.error || "Upload failed!");
                }
            } catch (err) {
                alert("Server error uploading file.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Upload Now 🚀";
            }
        }

        async function deleteDriveItem(e, type, id) {
            e.stopPropagation();
            if (confirm("⚠️ Are you sure you want to delete this?")) {
                await fetch('/api/admin/delete-drive-item', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type: type, id: id })
                });
                loadDriveContents();
            }
        }

        // --- NOTIFICATION LOGIC ---
        async function loadNotifications() {
            const feed = document.getElementById('chat-feed');
            const res = await fetch('/api/admin/get-notifications');
            const data = await res.json();
            if(data.success) {
                feed.innerHTML = '';
                data.notifications.forEach(n => {
                    feed.innerHTML += `<div class="msg-bubble">${n.message}</div>`;
                });
            }
        }

        async function submitNotification() {
            const msg = document.getElementById('notif-message').value;
            const role = document.getElementById('target-role').value;
            if(!msg) return;
            await fetch('/api/admin/send-notification', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: msg, target_role: role })
            });
            document.getElementById('notif-message').value = '';
            loadNotifications();
        }
    </script>
</body>
</html>
