<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { color-scheme: light; }
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-container { background: #ffffff; width: 100%; max-width: 450px; min-height: 90vh; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); padding: 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; }
        .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .admin-header h1 { font-size: 1.4rem; margin: 0; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .admin-header h1 i { color: #3b82f6; }
        .back-menu-btn { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 10px; font-weight: bold; color: #3b82f6; cursor: pointer; display: none; }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .admin-card { background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); border: 1px solid #e2e8f0; border-radius: 18px; padding: 20px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .admin-card:hover { transform: translateY(-4px); border-color: #3b82f6; }
        
        .card-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; margin-bottom: 10px; color: white; }
        .card-notif .card-icon { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .card-folder .card-icon { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .card-upload .card-icon { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }

        .card-title { font-size: 0.9rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .card-desc { font-size: 0.72rem; color: #64748b; }

        .panel-view { display: none; flex: 1; flex-direction: column; }
        .panel-view.active { display: flex; }

        .chat-feed { flex: 1; padding: 10px; overflow-y: auto; background: #f8fafc; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 380px; margin-bottom: 10px; }
        .msg-bubble { background: #3b82f6; color: white; padding: 10px 14px; border-radius: 14px 14px 2px 14px; align-self: flex-end; max-width: 85%; font-size: 0.88rem; }
        .chat-input-bar { display: flex; gap: 8px; align-items: center; }
        .input-box { flex: 1; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px; font-size: 0.9rem; outline: none; }
        .btn-send { background: #3b82f6; color: white; border: none; width: 42px; height: 42px; border-radius: 12px; cursor: pointer; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.9rem; outline: none; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #22c55e; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1 id="admin-title"><i class="fas fa-user-shield"></i> Admin Panel</h1>
            <button class="back-menu-btn" id="back-btn" onclick="showDashboardMenu()"><i class="fas fa-th-large"></i> Menu</button>
        </div>

        <!-- MAIN DASHBOARD MENU -->
        <div id="dashboard-menu">
            <div class="admin-grid">
                <div class="admin-card card-notif" onclick="openPanel('notif-panel', '📢 Send Notification')">
                    <div class="card-icon"><i class="fas fa-bullhorn"></i></div>
                    <div class="card-title">Notification</div>
                    <div class="card-desc">Broadcast Messages</div>
                </div>

                <div class="admin-card card-folder" onclick="openPanel('folder-panel', '📁 Create Folders')">
                    <div class="card-icon"><i class="fas fa-folder-plus"></i></div>
                    <div class="card-title">Create Folders</div>
                    <div class="card-desc">Add New Class & Subject</div>
                </div>

                <div class="admin-card card-upload" onclick="openPanel('upload-panel', '📚 Upload Content')" style="grid-column: span 2;">
                    <div class="card-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <div class="card-title">Upload Materials</div>
                    <div class="card-desc">Add PDFs, Short Notes & Mind Maps into folders</div>
                </div>
            </div>
        </div>

        <!-- NOTIFICATION PANEL -->
        <div id="notif-panel" class="panel-view">
            <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;">
                <label>Target:</label>
                <select id="target-role" style="padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1;">
                    <option value="All">All Users</option>
                    <option value="Student">Students Only</option>
                    <option value="Teacher">Teachers Only</option>
                </select>
            </div>
            <div class="chat-feed" id="chat-feed"></div>
            <div class="chat-input-bar">
                <input type="text" class="input-box" id="notif-message" placeholder="Type announcement...">
                <button class="btn-send" onclick="submitNotification()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- NEW FOLDER CREATION PANEL -->
        <div id="folder-panel" class="panel-view">
            <form onsubmit="handleCreateFolder(event)">
                <div class="form-group">
                    <label>Enter Class Name / Folder Name</label>
                    <input type="text" id="new-class-name" placeholder="e.g. Class 7 or Class 8 or WBJEE Special" required>
                </div>
                <div class="form-group">
                    <label>Enter Subject Name (Optional)</label>
                    <input type="text" id="new-subject-name" placeholder="e.g. Physics or History or General Knowledge">
                    <span style="font-size: 0.75rem; color:#64748b;">Leave empty if you only want to create a Class folder.</span>
                </div>
                <button type="submit" class="btn-submit" style="background: #f59e0b;">Create Folder 📁</button>
            </form>
        </div>

        <!-- UPLOAD MATERIAL PANEL -->
        <div id="upload-panel" class="panel-view">
            <form onsubmit="handleResourceUpload(event)">
                <div class="form-group">
                    <label>Select Class Folder</label>
                    <select id="res-class" onchange="loadDynamicSubjects()" required>
                        <option value="" disabled selected>Loading Folders...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Subject Folder</label>
                    <select id="res-subject" required>
                        <option value="" disabled selected>Select Class First...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Content Type</label>
                    <select id="res-type" required>
                        <option value="Notes">Full Chapter Notes 📑</option>
                        <option value="Short Notes">Short Notes 📝</option>
                        <option value="Mind Map">Mind Map 🧠</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Title / Chapter Name</label>
                    <input type="text" id="res-title" placeholder="e.g. Chapter 1 Solution Notes" required>
                </div>

                <div class="form-group">
                    <label>Select PDF / Material File</label>
                    <input type="file" id="res-file" accept=".pdf,.doc,.docx,.png,.jpg" required>
                </div>

                <button type="submit" class="btn-submit" id="upload-btn">Upload Material 🚀</button>
            </form>
        </div>

    </div>

    <script>
        function openPanel(panelId, titleText) {
            document.getElementById('dashboard-menu').style.display = 'none';
            document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            document.getElementById('admin-title').innerHTML = titleText;
            document.getElementById('back-btn').style.display = 'block';

            if (panelId === 'upload-panel') loadDynamicClasses();
        }

        function showDashboardMenu() {
            document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
            document.getElementById('dashboard-menu').style.display = 'block';
            document.getElementById('admin-title').innerHTML = '<i class="fas fa-user-shield"></i> Admin Panel';
            document.getElementById('back-btn').style.display = 'none';
        }

        // নতুন ফোল্ডার তৈরি
        async function handleCreateFolder(e) {
            e.preventDefault();
            const className = document.getElementById('new-class-name').value.trim();
            const subjectName = document.getElementById('new-subject-name').value.trim();

            try {
                const res = await fetch('/api/admin/create-folder', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ class_name: className, subject_name: subjectName })
                });
                const data = await res.json();
                if(data.success) {
                    alert("🎉 " + data.message);
                    document.getElementById('new-class-name').value = '';
                    document.getElementById('new-subject-name').value = '';
                } else {
                    alert(data.error || "Failed");
                }
            } catch(e) { alert("Server error"); }
        }

        // ডাইনামিক ক্লাস ও সাবজেক্ট সিলেক্টর লোড
        async function loadDynamicClasses() {
            const classSelect = document.getElementById('res-class');
            try {
                const res = await fetch('/api/get-dynamic-folders');
                const data = await res.json();
                if(data.success && data.classes.length > 0) {
                    classSelect.innerHTML = '<option value="" disabled selected>Select Class...</option>';
                    data.classes.forEach(c => {
                        classSelect.innerHTML += `<option value="${c}">${c}</option>`;
                    });
                } else {
                    classSelect.innerHTML = '<option value="" disabled>No Folders Created Yet! Create First.</option>';
                }
            } catch(e) { console.error(e); }
        }

        async function loadDynamicSubjects() {
            const className = document.getElementById('res-class').value;
            const subSelect = document.getElementById('res-subject');
            try {
                const res = await fetch('/api/get-dynamic-folders', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ class_name: className })
                });
                const data = await res.json();
                if(data.success && data.subjects.length > 0) {
                    subSelect.innerHTML = '<option value="" disabled selected>Select Subject...</option>';
                    data.subjects.forEach(s => {
                        subSelect.innerHTML += `<option value="${s}">${s}</option>`;
                    });
                } else {
                    subSelect.innerHTML = '<option value="General">General / All Subjects</option>';
                }
            } catch(e) { console.error(e); }
        }

        // ফাইল আপলোড
        async function handleResourceUpload(e) {
            e.preventDefault();
            const btn = document.getElementById('upload-btn');
            btn.disabled = true;

            const formData = new FormData();
            formData.append('class_name', document.getElementById('res-class').value);
            formData.append('subject_name', document.getElementById('res-subject').value);
            formData.append('resource_type', document.getElementById('res-type').value);
            formData.append('title', document.getElementById('res-title').value);
            formData.append('file', document.getElementById('res-file').files[0]);

            try {
                const response = await fetch('/api/admin/upload-resource', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) {
                    alert("🎉 " + data.message);
                    e.target.reset();
                } else { alert(data.error || "Failed"); }
            } catch (err) { alert("Server error"); } 
            finally { btn.disabled = false; }
        }
    </script>
</body>
</html>
