<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { color-scheme: light; }
        body { 
            background-color: #f8fafc; color: #1e293b; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: flex; justify-content: center;
        }
        .container { 
            width: 100%; max-width: 480px; background-color: #ffffff;
            min-height: 100vh; padding: 0 1rem 5rem 1rem; 
            box-sizing: border-box; box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        /* Fixed Sticky Header Style */
        .sticky-header {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            z-index: 999;
            padding: 1rem 0 0.8rem 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* আগের সেই নীল রঙের ছোট ব্যাক বাটন স্টাইল */
        .back-btn { 
            background: none; 
            border: none; 
            font-size: 1.2rem; 
            color: #3b82f6; 
            cursor: pointer; 
            padding: 0;
            display: flex;
            align-items: center;
        }

        .header h1 { font-size: 1.3rem; margin: 0; color: #0f172a; font-weight: 800; }

        .notif-list { display: flex; flex-direction: column; gap: 12px; }
        
        .notif-card {
            background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 12px; padding: 14px; position: relative;
            transition: 0.2s;
        }
        
        /* নতুন/Unread নোটিফিকেশনের সবুজ ব্যাকগ্রাউন্ড আভা ও সবুজ ডট */
        .notif-card.is-new {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .green-dot {
            width: 10px; height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            position: absolute;
            top: 15px; right: 15px;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        .notif-title { font-size: 0.95rem; font-weight: 600; color: #1e293b; margin-bottom: 6px; padding-right: 15px; line-height: 1.4; }
        .notif-date { font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ফিক্সড হেডার এবং আগের মতো নীল ব্যাক বাটন -->
        <div class="sticky-header">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
            <div class="header">
                <h1>Notifications 🔔</h1>
            </div>
        </div>

        <div class="notif-list" id="notif-container">
            <p style="text-align:center; color:#94a3b8; padding:20px;">Loading notifications...</p>
        </div>
    </div>

    <script>
        window.onload = async () => {
            const userEmail = localStorage.getItem('userEmail');
            const container = document.getElementById('notif-container');

            if (!userEmail) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Please login to view notifications.</p>';
                return;
            }

            try {
                const response = await fetch('/api/get-notifications-page', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await response.json();

                if (data.success && data.notifications.length > 0) {
                    container.innerHTML = "";
                    data.notifications.forEach(n => {
                        const card = document.createElement('div');
                        card.className = `notif-card ${n.is_unread ? 'is-new' : ''}`;
                        
                        card.innerHTML = `
                            ${n.is_unread ? '<span class="green-dot" title="New Notification"></span>' : ''}
                            <div class="notif-title">${escapeHTML(n.message)}</div>
                            <div class="notif-date"><i class="far fa-clock"></i> ${n.date}</div>
                        `;
                        container.appendChild(card);
                    });

                    markNotificationsAsRead(userEmail);

                } else {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:20px;">No notifications yet.</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="text-align:center; color:#ef4444; padding:20px;">Server error loading notifications.</p>';
            }
        };

        async function markNotificationsAsRead(email) {
            try {
                await fetch('/api/mark-notifications-read', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
            } catch (e) { console.log("Read status update error:", e); }
        }

        function goBack() {
            window.history.back();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
        // নোটিফিকেশন কার্ড তৈরির সময় লিংক থাকলে তা দেখানোর কোড:
        let linkHtml = n.link_url ? `<br><a href="${n.link_url}" target="_blank" style="display:inline-block; margin-top:8px; background:#22c55e; color:#white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:bold;"><i class="fas fa-external-link-alt"></i> Open Attached Link</a>` : '';

        // এটি মেসেজ ববলের ভেতরে প্রিন্ট হবে:
        // ${n.message} ${linkHtml}

    </script>
</body>
</html>
