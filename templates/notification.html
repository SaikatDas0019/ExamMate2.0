<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* আপনার পুরোনো CSS স্টাইলগুলো এখানে যেমন ছিল তেমনই থাকবে */
        :root { color-scheme: light; }
        body { background-color: #f9fafb; color: #333333; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background-color: #ffffff; min-height: 100vh; padding: 1.5rem; box-sizing: border-box; }
        .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { background: none; border: none; font-size: 1.5rem; color: #3b82f6; cursor: pointer; }
        .page-title { font-size: 1.5rem; font-weight: 800; color: #111827; margin: 0; }
        
        .notification-list { display: flex; flex-direction: column; gap: 15px; }
        .notif-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; display: flex; gap: 15px; align-items: flex-start; }
        .notif-icon { background: #e0f2fe; color: #0284c7; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .notif-content { flex: 1; }
        .notif-msg { font-size: 0.95rem; color: #334155; margin-bottom: 5px; line-height: 1.4; }
        .notif-date { font-size: 0.75rem; color: #64748b; font-weight: 600; }
        .empty-msg { text-align: center; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
            <h1 class="page-title">Notifications</h1>
        </div>

        <div class="notification-list" id="notif-container">
            <div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Loading notifications...</div>
        </div>
    </div>

    <script>
        function goBack() {
            window.history.back(); // আগের পেজে ফেরত যাওয়ার জন্য
        }

        window.onload = async () => {
            const userEmail = localStorage.getItem('userEmail');
            const container = document.getElementById('notif-container');

            if (!userEmail) {
                container.innerHTML = `<div class="empty-msg">Please log in to see notifications.</div>`;
                return;
            }

            try {
                const response = await fetch('/api/notifications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.notifications.length === 0) {
                        container.innerHTML = `<div class="empty-msg">No new notifications. 📭</div>`;
                    } else {
                        container.innerHTML = "";
                        data.notifications.forEach(notif => {
                            const card = document.createElement('div');
                            card.className = "notif-card";
                            card.innerHTML = `
                                <div class="notif-icon"><i class="fas fa-bell"></i></div>
                                <div class="notif-content">
                                    <div class="notif-msg">${notif.msg}</div>
                                    <div class="notif-date">${notif.date}</div>
                                </div>
                            `;
                            container.appendChild(card);
                        });
                    }
                } else {
                    container.innerHTML = `<div class="empty-msg" style="color:red;">Failed to load notifications.</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="empty-msg" style="color:red;">Server error. Please try again later.</div>`;
            }
        };
    </script>
</body>
</html>
