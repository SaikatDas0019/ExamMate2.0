<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Create Custom Exam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Global Theme (Pure White) */
        :root { color-scheme: light; }
        body { 
            background-color: #f3f4f6; 
            color: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%;
            max-width: 500px; 
            background-color: #ffffff;
            min-height: 100vh;
            padding: 1.5rem 1.5rem 5rem 1.5rem; 
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        /* Top Back Button */
        .back-btn {
            background: transparent; color: #10b981; border: none; 
            font-weight: bold; font-size: 14px; cursor: pointer; 
            padding: 0; margin-bottom: 10px; display: flex; align-items: center; gap: 5px;
        }
        .back-btn:hover { color: #059669; text-decoration: underline; }

        h1 { font-size: 24px; color: #1a1a1a; margin-top: 0; margin-bottom: 20px; }

        /* Card Layouts */
        .card-basic {
            background-color: #f8fafc; border: 1px solid #cbd5e1;
            border-radius: 12px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .card-ai {
            background-color: #f1f5f9; border: 2px dashed #8b5cf6;
            border-radius: 12px; padding: 20px; margin-bottom: 20px;
        }

        h3 { margin-top: 0; font-size: 16px; color: #1a1a1a; margin-bottom: 15px;}
        .ai-title { color: #6d28d9; }

        /* Inputs */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; color: #333333; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        .input-group input, .input-group textarea, .input-group select {
            width: 100%; padding: 10px; background-color: #ffffff; color: #1a1a1a;
            border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; outline: none;
        }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: #3b82f6; }
        
        /* 2x2 Grid for layout */
        .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Buttons */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-ai { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 4px 6px rgba(139, 92, 246, 0.3); }
        .btn-ai:hover { opacity: 0.9; }
        .btn-add { background-color: #3b82f6; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); margin-top: 10px; }
        .btn-add:hover { background-color: #2563eb; }
        .btn-publish { background: linear-gradient(135deg, #10b981, #059669); padding: 15px; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3); margin-top: 20px;}
        .btn-publish:hover { opacity: 0.9; }

        /* File Upload styling */
        .file-upload-wrapper { margin-bottom: 15px; }
        .file-upload-wrapper input[type="file"] { font-size: 0.85rem; }

        /* Preview List */
        .preview-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-top: 15px;}
        .preview-item { border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; font-size: 0.9rem;}
        .preview-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        
        .hidden { display: none; }
        .loading-text { text-align: center; color: #8b5cf6; font-weight: bold; font-size: 0.9rem; margin-top: 10px;}
    </style>
</head>
<body>

    <div class="container">
        
        <button class="back-btn" onclick="window.location.href='teacher_dashboard.html'">⬅️ Back to Dashboard</button>
        <h1>Create Custom Exam</h1>

        <div class="card-basic">
            <div class="input-group">
                <label>Exam Name</label>
                <input type="text" id="exam-name" placeholder="e.g. Physics Sem 1">
            </div>
            <div class="grid-2x2">
                <div class="input-group">
                    <label>Exam Code</label>
                    <input type="text" id="exam-code" placeholder="PHY-101" style="text-transform: uppercase;">
                </div>
                <div class="input-group">
                    <label>Timer (Mins)</label>
                    <input type="number" id="exam-timer" min="1" max="180" value="30">
                </div>
            </div>
        </div>

        <!-- 🔄 আপডেট করা জেমিনি পিডিএফ স্ক্যানার সেকশন -->
        <div class="card-ai">
            <h3 class="ai-title">✨ AI Question PDF Scanner</h3>
            <div class="file-upload-wrapper">
                <label style="font-size: 0.85rem; font-weight: 600; color: #333;">Upload Question Paper PDF</label><br>
                <input type="file" id="ai-pdf" accept=".pdf" style="margin-top: 5px;">
            </div>
            
            <button class="btn btn-ai" onclick="scanPDFWithAI()">Extract Questions with Gemini 🪄</button>
            <div id="ai-loading" class="loading-text hidden">Gemini is reading the PDF and generating JSON questions...</div>
        </div>

        <div class="card-basic">
            <h3 id="manual-title">📝 Add Manually (Total added: 0)</h3>
            
            <div class="input-group">
                <label>Question Text</label>
                <textarea id="q-text" rows="3" placeholder="Type your question here..."></textarea>
            </div>
            
            <div class="grid-2x2">
                <div class="input-group">
                    <label>Option A</label>
                    <input type="text" id="opt-a">
                </div>
                <div class="input-group">
                    <label>Option B</label>
                    <input type="text" id="opt-b">
                </div>
                <div class="input-group">
                    <label>Option C</label>
                    <input type="text" id="opt-c">
                </div>
                <div class="input-group">
                    <label>Option D</label>
                    <input type="text" id="opt-d">
                </div>
            </div>

            <div class="input-group">
                <label>Correct Answer</label>
                <select id="opt-correct">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <button class="btn btn-add" onclick="addQuestionManually()">Add This Question ➕</button>
        </div>

        <div id="preview-section" class="hidden">
            <h3>Current Question Paper Preview:</h3>
            <div class="preview-box" id="preview-list"></div>
        </div>

        <button class="btn btn-publish" onclick="publishExam()">Publish & Post Entire Exam 🚀</button>

    </div>

    <script>
        // State Array to hold questions
        let tempQuestions = [];

        // Update UI
        function updateUI() {
            document.getElementById('manual-title').innerText = `📝 Add Manually (Total added: ${tempQuestions.length})`;
            
            const previewSection = document.getElementById('preview-section');
            const previewList = document.getElementById('preview-list');
            
            if (tempQuestions.length > 0) {
                previewSection.classList.remove('hidden');
                previewList.innerHTML = tempQuestions.map((q, i) => `
                    <div class="preview-item">
                        <strong>Q${i + 1}:</strong> ${q.question_text} <br>
                        <span style="color:#10b981; font-size:0.8rem;">(Correct: ${q.correct_option})</span>
                    </div>
                `).join('');
            } else {
                previewSection.classList.add('hidden');
            }
        }

        // Add Manually
        function addQuestionManually() {
            const qText = document.getElementById('q-text').value;
            const optA = document.getElementById('opt-a').value;
            const optB = document.getElementById('opt-b').value;
            const optC = document.getElementById('opt-c').value;
            const optD = document.getElementById('opt-d').value;
            const correctOpt = document.getElementById('opt-correct').value;

            if (!qText || !optA || !optB || !optC || !optD) {
                alert("Please fill in all the fields for the question.");
                return;
            }

            tempQuestions.push({
                question_text: qText, option_a: optA, option_b: optB, option_c: optC, option_d: optD, correct_option: correctOpt
            });

            // Clear inputs
            document.getElementById('q-text').value = '';
            document.getElementById('opt-a').value = '';
            document.getElementById('opt-b').value = '';
            document.getElementById('opt-c').value = '';
            document.getElementById('opt-d').value = '';

            updateUI();
        }

        // 🔄 আসল Gemini PDF ব্যাকএন্ড কল ফাংশন
        async function scanPDFWithAI() {
            const fileInput = document.getElementById('ai-pdf');
            if (fileInput.files.length === 0) {
                alert("Please upload a PDF question paper first.");
                return;
            }

            const loadingDiv = document.getElementById('ai-loading');
            const aiBtn = document.querySelector('.btn-ai');
            
            loadingDiv.classList.remove('hidden');
            aiBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/extract-pdf-gemini', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // জেমিনি থেকে আসা JSON প্রশ্নগুলো অ্যারেতে যুক্ত করা
                    tempQuestions = tempQuestions.concat(data.questions);
                    alert(`🎉 Success! Gemini extracted ${data.questions.length} questions from the PDF.`);
                    updateUI();
                } else {
                    alert(data.error || "Failed to extract questions from PDF.");
                }
            } catch (error) {
                alert("Server connection error while contacting Gemini API.");
                console.error(error);
            } finally {
                loadingDiv.classList.add('hidden');
                aiBtn.disabled = false;
                fileInput.value = ""; // Clear file input
            }
        }

        // Publish Exam
        async function publishExam() {
            const examName = document.getElementById('exam-name').value;
            const examCode = document.getElementById('exam-code').value.toUpperCase();
            const timer = document.getElementById('exam-timer').value;
            const teacherEmail = localStorage.getItem('userEmail') || 'dasbabu938207@gmail.com';
            
            if (!examName || !examCode) { alert("Please provide the exam name and unique code."); return; }
            if (tempQuestions.length === 0) { alert("Please add at least 1 question before publishing!"); return; }

            const publishBtn = document.querySelector('.btn-publish');
            publishBtn.innerText = "Publishing... ⏳";
            publishBtn.disabled = true;

            try {
                const response = await fetch('/api/create-exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exam_code: examCode, exam_name: examName, timer: timer,
                        teacher_email: teacherEmail, questions: tempQuestions
                    })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    alert(`🎉 Awesome! Your exam has been successfully created.\nShare this code with your students: ${examCode}`);
                    window.location.href = 'teacher_dashboard.html';
                } else {
                    alert(data.error || "Failed to create exam.");
                }
            } catch (error) {
                alert("Server connection error.");
            } finally {
                publishBtn.innerText = "Publish & Post Entire Exam 🚀";
                publishBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
