<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { color-scheme: dark; }
        body {
            background-color: #05070f; background: linear-gradient(180deg, #08101f 0%, #04060d 100%);
            color: #e8eef8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 🔴 নতুন লোডিং বা স্পিনার স্ক্রিন স্টাইল */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #05070f; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(34, 192, 93, 0.2);
            border-top: 4px solid #22c05d; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 1.1rem; color: #c8d3ea; font-weight: 600; letter-spacing: 0.5px; }

        /* মেইন কন্টেন্ট যা শুরুতে লুকিয়ে থাকবে যতক্ষণ না স্ট্যাটাস চেক শেষ হয় */
        #main-content { display: none; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .container { padding: 2rem; max-width: 600px; width: 100%; box-sizing: border-box; }
        
        .header-section { text-align: center; margin-bottom: 2rem; }
        .header-section h1 { margin: 0 0 0.35rem 0; color: #f5f9ff; font-size: 2.6rem; letter-spacing: -0.03em; }
        .header-section p { margin: 0; color: #c8d3ea; font-size: 1.05rem; }

        .auth-card {
            background: rgba(17, 29, 52, 0.4); border-radius: 26px; padding: 40px 30px;
            margin-bottom: 1.8rem; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(34, 192, 93, 0.5); text-align: center;
        }
        .auth-card h2 { margin: 0 0 1.5rem 0; color: #f2f7ff; font-size: 1.4rem; }
        
        /* Custom Google Button */
        .btn-google { 
            width: 100%; max-width: 320px; margin: 0 auto;
            background: #ffffff; color: #374151; border: none; 
            border-radius: 25px; padding: 0.85rem 1rem; font-size: 1.05rem; font-weight: 700; 
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
            gap: 10px; box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .btn-google:hover { 
            background: #f9fafb; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,255,255,0.2); 
        }
        .btn-google img { width: 22px; height: 22px; }

        .divider { height: 1px; background: rgba(255,255,255,0.2); margin: 2.5rem 0 1.5rem 0; }
        .features-header { font-size: 1.3rem; color: #f2f7ff; margin-bottom: 1.5rem; text-align: left; }
        
        .feature-card {
            background: rgba(30, 166, 77, 0.1); border: 1px solid rgba(34, 192, 93, 0.3);
            border-radius: 12px; padding: 1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; color: #e8eef8; text-align: left;
        }
        .feature-icon { font-size: 1.2rem; color: #81c784; background: rgba(255, 255, 255, 0.05); border-radius: 50%; padding: 10px; width: 24px; text-align: center; }
        .feature-text strong { color: #f4fbff; font-size: 1rem; }
        .feature-text p { margin: 5px 0 0 0; color: #c8d3ea; font-size: 0.85rem; }

        #error-msg {
            color: #ef4444; font-size: 0.95rem; margin-top: 15px; display: none; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 🔴 লোডিং বা প্রোগ্রেস ইন্টারফেস -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Checking session, please wait...</div>
    </div>

    <!-- মূল পেজের কন্টেন্ট -->
    <div id="main-content" style="display: none;">
        <div class="container">
            <div class="header-section">
                <h1>ExamMate</h1>
                <p>Best app for MCQ practice of any exam.</p>
            </div>

            <div class="auth-card">
                <h2>Get Started with ExamMate</h2>
                
                <!-- Firebase Custom Google Button -->
                <button type="button" class="btn-google" id="btn-google-login">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo">
                    Continue with Google
                </button>
                <div id="error-msg"></div>

                <div class="divider"></div>
                <h2 class="features-header"><i class="fas fa-star" style="color: #f59e0b;"></i> Core Features</h2>

                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-clock"></i></div>
                    <div class="feature-text"><strong>Time Management:</strong> Testing with timers like the real thing.</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-pen"></i></div>
                    <div class="feature-text"><strong>Customize Exam:</strong> Teachers have the freedom to set questions.</div>
                </div>
            </div>
        </div>
    </div>

        <!-- Firebase Authentication SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEAVNT-8aGWYU-fWiFJd7mdjAmcOE4P8o",
            authDomain: "exammate-4dfa2.firebaseapp.com",
            projectId: "exammate-4dfa2",
            storageBucket: "exammate-4dfa2.firebasestorage.app",
            messagingSenderId: "424847388051",
            appId: "1:424847388051:web:73730432aaddc54e48c66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // 🔴 ফায়ারবেসের পার্মানেন্ট সেশন চালু রাখা
        setPersistence(auth, browserLocalPersistence).catch((err) => console.log(err));

        const provider = new GoogleAuthProvider();

        const loadingScreen = document.getElementById('loading-screen');
        const mainContent = document.getElementById('main-content');

        // 🔴 অ্যাপ ওপেন হলে ফায়ারবেসকে জিজ্ঞেস করা ইউজার লগইন আছে কি না
        onAuthStateChanged(auth, async (user) => {
            if (user && user.email) {
                try {
                    // ব্যাকএন্ডে চেক করা যে এই ইমেইল আমাদের ডেটাবেসে আছে কি না
                    const response = await fetch('/api/check-login-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: user.email })
                    });
                    const data = await response.json();
                    
                    if (data.logged_in) {
                        localStorage.setItem('userEmail', data.email);
                        localStorage.setItem('userName', data.name);
                        localStorage.setItem('user', JSON.stringify({email: data.email, name: data.name, role: data.role}));
                        window.location.href = data.redirect_url;
                        return;
                    }
                } catch (e) {
                    console.log("Check error", e);
                }
            }
            
            // যদি ফায়ারবেসে লগইন না থাকে বা ডেটাবেসে না থাকে, তবে ইনডেক্স পেজ দেখাও
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainContent.style.display = 'flex';
            }, 300);
        });

        // Handle Redirect Result after Google Login
        getRedirectResult(auth).then(async (result) => {
            if (result && result.user) {
                const user = result.user;
                const userData = {
                    email: user.email,
                    name: user.displayName,
                    photo_url: user.photoURL
                };

                const response = await fetch('/api/google-login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();

                if(data.success) {
                    if(data.is_new) {
                        localStorage.setItem('temp_user', JSON.stringify(userData));
                        window.location.href = '/setup_profile.html';
                    } else {
                        localStorage.setItem('user', JSON.stringify({
                            email: userData.email, 
                            name: data.name, 
                            role: data.role
                        }));
                        localStorage.setItem('userName', data.name);
                        localStorage.setItem('userEmail', userData.email);
                        window.location.href = data.redirect_url;
                    }
                } else {
                    alert("Login failed: " + data.error);
                }
            }
        }).catch((error) => {
            console.error("Redirect Error:", error);
        });

        document.getElementById('btn-google-login').addEventListener('click', async () => {
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                alert("Sign-In failed.");
            }
        });
    </script>

</body>
</html>
