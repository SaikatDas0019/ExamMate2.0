<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Teacher Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { color-scheme: light; }
        body { 
            background-color: #f1f5f9; color: #333333; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; display: flex; justify-content: center;
        }
        
        .container { 
            width: 100%; max-width: 480px; background-color: #f1f5f9;
            min-height: 100vh; padding-bottom: 70px; 
            box-sizing: border-box; margin: 0 auto; position: relative; overflow-x: hidden;
        }

        /* Fixed Top Section */
        .fixed-top-section {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; z-index: 999;
            background: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .sticky-header {
            padding: 12px 15px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #f8fafc;
        }
        .profile-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar { 
            width: 40px; height: 40px; background: #e0f2fe; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; border: 2px solid #38bdf8; color: #0369a1;
        }
        .greeting h3 { margin: 0; font-size: 1rem; font-weight: 800; color: #0f172a; }
        .greeting p { margin: 0; font-size: 0.7rem; color: #64748b; font-weight: 600;}
        .bell-icon { 
            font-size: 1.1rem; color: #4b5563; background: #f8fafc; 
            padding: 8px; border-radius: 50%; border: 1px solid #e2e8f0; cursor: pointer; position: relative;
        }

        .search-container { padding: 15px 15px 5px 15px; display: flex; gap: 10px; background: #ffffff; }
        .search-input-wrapper { flex: 1; position: relative; }
        .search-input-wrapper input {
            width: 100%; padding: 12px 15px; padding-left: 35px;
            background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 25px;
            font-size: 0.95rem; outline: none; box-sizing: border-box;
        }
        .search-input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        .search-btn-circle {
            width: 45px; height: 45px; border-radius: 50%; background: #3b82f6;
            color: white; border: none; font-size: 1.1rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }

        .filter-container {
            padding: 10px 15px 15px 15px; background: #ffffff;
            display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
            border-bottom: 1px solid #e5e7eb; margin-bottom: 10px;
        }
        .filter-pill {
            background: #ffffff; border: 1px solid #cbd5e1; color: #475569;
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 5px; outline: none;
        }

        /* Feed Container */
        .feed-container { padding: 15px; margin-top: 185px; }
        .feed-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .feed-title { font-size: 1.15rem; font-weight: 800; color: #1e293b; margin: 0 0 8px 0; }
        .feed-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;}
        .feed-tag { background: #f1f5f9; color: #475569; font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
        
        .btn-create-exam {
            display: block; width: 100%; background: linear-gradient(135deg, #10b981, #059669);
            color: white; text-align: center; padding: 12px; border-radius: 12px;
            font-weight: bold; text-decoration: none; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(16,185,129,0.3);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: #ffffff; border-top: 1px solid #e5e7eb;
            display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #6b7280; font-size: 0.75rem; cursor: pointer; flex: 1; text-decoration: none;}
        .nav-item.active { color: #3b82f6; font-weight: bold; }
        .nav-icon { font-size: 1.2rem; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fixed Top Section -->
        <div class="fixed-top-section">
            <div class="sticky-header">
                <div class="profile-left" onclick="window.location.href='teacher_profile.html'">
                    <div class="avatar" id="nav-avatar">T</div>
                    <div class="greeting">
                        <h3 id="teacher-name">Hi, Teacher</h3>
                        <p>Manage your classes! 🎓</p>
                    </div>
                </div>
                <div class="bell-icon" onclick="window.location.href='notification.html'"><i class="fas fa-bell"></i></div>
            </div>

            <div class="search-container">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="main-search" placeholder="Search your exams...">
                </div>
                <button class="search-btn-circle" onclick="loadTeacherFeed()">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Feed Container -->
        <div class="feed-container" id="teacher-feed">
            <a href="create_exam.html" class="btn-create-exam"><i class="fas fa-plus-circle"></i> Create New Exam 📝</a>
            <div id="exams-list-container">
                <p style="text-align:center; color:#64748b;">Loading your exams...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a href="teacher_dashboard.html" class="nav-item active">
            <div class="nav-icon"><i class="fas fa-home"></i></div><span>Home</span>
        </a>
        <a href="teacher_analytics.html" class="nav-item">
            <div class="nav-icon"><i class="fas fa-chart-bar"></i></div><span>Analytics</span>
        </a>
        <a href="teacher_profile.html" class="nav-item">
            <div class="nav-icon"><far fa-user></far><i class="far fa-user"></i></div><span>Profile</span>
        </a>
    </div>

    <script>
        window.onload = () => {
            const userName = localStorage.getItem('userName') || "Teacher";
            document.getElementById('teacher-name').innerText = "Hi, " + userName.split(' ')[0];
            document.getElementById('nav-avatar').innerText = userName.charAt(0).toUpperCase();
            loadTeacherFeed();
        };

        async function loadTeacherFeed() {
            const userEmail = localStorage.getItem('userEmail');
            const container = document.getElementById('exams-list-container');
            
            try {
                const response = await fetch('/api/teacher-dashboard', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await response.json();

                if (data.success && data.all_exams.length > 0) {
                    container.innerHTML = '';
                    data.all_exams.forEach(ex => {
                        container.innerHTML += `
                        <div class="feed-card">
                            <h3 class="feed-title">${ex.name}</h3>
                            <div class="feed-tags">
                                <span class="feed-tag">Code: ${ex.code}</span>
                            </div>
                            <button class="btn-create-exam" style="background:#3b82f6; margin-top:10px; margin-bottom:0; padding:8px;" onclick="window.location.href='teacher_analytics.html?code=${ex.code}'">View Analysis & Manage 📊</button>
                        </div>`;
                    });
                } else {
                    container.innerHTML = `<p style="text-align:center; color:#64748b;">No exams created yet.</p>`;
                }
            } catch(e) { container.innerHTML = `<p style="text-align:center; color:#ef4444;">Error loading feed.</p>`; }
        }
    </script>
</body>
</html>
