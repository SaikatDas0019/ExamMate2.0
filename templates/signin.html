<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Sign In</title>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root { color-scheme: light; }
        html, body { width: 100%; overflow-x: hidden; }
        body { 
            background-color: #ffffff; 
            color: #333333; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 450px; padding: 1.5rem; margin: auto; }
        .custom-title { text-align: center; font-size: 2rem; font-weight: 800; margin-bottom: 5px; color: #000000; }
        .custom-subtitle { text-align: center; color: #4b5563; font-size: 1rem; margin-bottom: 2rem; }
        
        .input-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; width: 100%; }
        .input-group label { color: #333333; font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
        .input-group select { 
            width: 100%; background-color: #ffffff; border: 1px solid #d1d5db; color: #000000; 
            border-radius: 12px; padding: 14px 16px; font-size: 1rem; outline: none; transition: all 0.3s ease;
        }
        .input-group select:focus { border: 1px solid #3b82f6; box-shadow: 0 0 5px rgba(59, 130, 246, 0.4); }

        .btn-google { 
            width: 100%; background: #ffffff; color: #374151; border: 1px solid #d1d5db; 
            border-radius: 25px; padding: 0.85rem 1rem; font-size: 1.05rem; font-weight: 700; 
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
            gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 10px;
        }
        .btn-google:hover { background: #f9fafb; border-color: #9ca3af; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .btn-google img { width: 22px; height: 22px; }

        .btn-secondary { 
            width: 100%; background: #f8fafc; color: #4b5563; border: 1px solid #cbd5e1; 
            border-radius: 25px; padding: 0.85rem 1rem; font-size: 0.95rem; font-weight: 600; 
            cursor: pointer; transition: all 0.3s ease; margin-top: 15px; text-align: center;
        }
        .btn-secondary:hover { background: #f1f5f9; color: #1e293b; border: 1px solid #94a3b8; }

        #signin-error {
            width: 100%; word-wrap: break-word; color: #ef4444; font-size: 0.95rem; margin-bottom: 15px; 
            display: none; font-weight: bold; text-align: center; background: #fef2f2; padding: 10px; 
            border-radius: 8px; border: 1px solid #fee2e2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="signin-error"></div>
        
        <div class="custom-title">Sign In</div>
        <div class="custom-subtitle">Welcome back to ExamMate</div>
        
        <div class="input-group">
            <label>🎓 Select Your Role</label>
            <select id="role">
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
            </select>
        </div>

        <button type="button" class="btn-google" id="btn-google-signin">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo">
            Sign In with Google
        </button>

        <button type="button" class="btn-secondary" onclick="window.location.href='signup.html'">Don't have an account? Create Account</button>
    </div>

    <!-- Firebase Authentication SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEAVNT-8aGWYU-fWiFJd7mdjAmcOE4P8o",
            authDomain: "exammate-4dfa2.firebaseapp.com",
            projectId: "exammate-4dfa2",
            storageBucket: "exammate-4dfa2.firebasestorage.app",
            messagingSenderId: "424847388051",
            appId: "1:424847388051:web:73730432aaddc54e48c66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        function showErr(msg) {
            const box = document.getElementById('signin-error');
            box.innerText = msg;
            box.style.display = 'block';
        }

        document.getElementById('btn-google-signin').addEventListener('click', async () => {
            const role = document.getElementById('role').value;
            
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // ব্যাকএন্ডের সাথে তথ্য সিঙ্ক করা
                const response = await fetch('/api/google-auth-sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: user.displayName,
                        email: user.email,
                        role: role
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userName', user.displayName);
                    window.location.href = data.redirect_url;
                } else {
                    showErr(data.error || "Login sync failed!");
                }
            } catch (error) {
                console.error("Firebase Login Error:", error);
                showErr("Google Sign-In failed or was cancelled.");
            }
        });
    </script>
</body>
</html>
