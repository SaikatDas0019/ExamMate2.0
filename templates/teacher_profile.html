<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamMate | Teacher Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { color-scheme: light; }
        body { 
            background-color: #f1f5f9; color: #333333; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; display: flex; justify-content: center;
        }
        
        .container { 
            width: 100%; max-width: 480px; background-color: #f1f5f9;
            min-height: 100vh; padding-bottom: 70px; 
            box-sizing: border-box; margin: 0 auto; position: relative; overflow-x: hidden;
        }

        .sticky-header {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; z-index: 999;
            background: #ffffff; padding: 15px; box-sizing: border-box;
            border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between;
        }
        .header-title { font-size: 1.2rem; font-weight: 800; color: #0f172a; margin: 0; }
        .settings-btn { background: transparent; border: none; font-size: 1.4rem; color: #475569; cursor: pointer; }

        .profile-info-box {
            background: #ffffff; padding: 30px 15px; margin-top: 60px;
            text-align: center; border-bottom: 1px solid #e2e8f0;
        }
        .profile-avatar-large {
            width: 80px; height: 80px; background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; color: white; margin: 0 auto 15px auto;
        }
        .profile-name { font-size: 1.4rem; font-weight: 900; color: #1e293b; margin: 0 0 5px 0; }
        .profile-email { font-size: 0.85rem; color: #64748b; margin: 0 0 10px 0; }
        .profile-role { display: inline-block; background: #eff6ff; color: #1e3a8a; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

        .content-area { padding: 15px; }
        .section-title { font-size: 1.05rem; font-weight: 700; color: #1f2937; margin: 0 0 1rem 0; }

        /* Metrics Grid */
        .progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
        .progress-card { 
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; 
            padding: 12px; display: flex; flex-direction: column; gap: 5px; 
        }
        .progress-info { width: 100%; display: flex; justify-content: space-between; align-items: center;}
        .progress-info span { font-size: 0.8rem; color: #475569; font-weight: 700; }
        .progress-card b { font-size: 1.4rem; color: #0f172a; }

        /* Exam List Cards with Edit/Delete */
        .exam-manage-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-action-group { display: flex; gap: 6px; }
        .btn-edit { background: #eff6ff; color: #3b82f6; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-delete { background: #fef2f2; color: #ef4444; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }

        /* Settings Bottom Sheet */
        .settings-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5); z-index: 1000; justify-content: center; align-items: flex-end;
        }
        .settings-sheet {
            background: #ffffff; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
            padding: 20px 15px 40px 15px; box-sizing: border-box;
        }
        .sheet-drag-handle { width: 40px; height: 5px; background: #cbd5e1; border-radius: 5px; margin: 0 auto 20px auto; }
        .settings-option {
            display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 12px;
            font-size: 1rem; font-weight: 600; color: #1e293b; cursor: pointer; margin-bottom: 8px;
        }
        .settings-option:hover { background: #f1f5f9; }
        .opt-logout { color: #ef4444 !important; }

        /* Edit View Panel */
        .panel-view { display: none; background: #ffffff; min-height: 100vh; padding-top: 60px; }
        .panel-content { padding: 15px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #475569; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .btn-save { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: #ffffff; border-top: 1px solid #e5e7eb;
            display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #6b7280; font-size: 0.75rem; cursor: pointer; flex: 1; text-decoration: none;}
        .nav-item.active { color: #3b82f6; font-weight: bold; }
        .nav-icon { font-size: 1.2rem; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Profile View -->
        <div id="main-profile-view">
            <div class="sticky-header">
                <h1 class="header-title">Teacher Profile</h1>
                <button class="settings-btn" onclick="openSettings()"><i class="fas fa-cog"></i></button>
            </div>

            <div class="profile-info-box">
                <div class="profile-avatar-large" id="main-avatar">T</div>
                <h2 class="profile-name" id="main-name">Teacher Name</h2>
                <p class="profile-email" id="main-email">teacher@email.com</p>
                <div class="profile-role" id="main-role">Role: Teacher</div>
            </div>

            <div class="content-area">
                <div class="section-title">📊 Teaching Analytics Overview</div>
                
                <!-- 4 Metrics Cards moved from Dashboard -->
                <div class="progress-grid">
                    <div class="progress-card">
                        <div class="progress-info"><span>Total Attempts</span><i class="fas fa-file-alt" style="color:#10b981;"></i></div>
                        <b id="stat-attempts">00</b>
                    </div>
                    <div class="progress-card">
                        <div class="progress-info"><span>Total Students</span><i class="fas fa-users" style="color:#3b82f6;"></i></div>
                        <b id="stat-students">00</b>
                    </div>
                    <div class="progress-card">
                        <div class="progress-info"><span>Avg Score</span><i class="fas fa-chart-line" style="color:#f59e0b;"></i></div>
                        <b id="stat-avg">0%</b>
                    </div>
                    <div class="progress-card">
                        <div class="progress-info"><span>Active Exams</span><i class="fas fa-layer-group" style="color:#8b5cf6;"></i></div>
                        <b id="stat-exams">00</b>
                    </div>
                </div>

                <div class="section-title" style="margin-top:20px;">📝 Manage Created Exams</div>
                <div id="teacher-exams-manage-list">
                    <p style="color:#64748b; text-align:center;">Loading exams...</p>
                </div>
            </div>
        </div>

        <!-- Settings Bottom Sheet -->
        <div class="settings-overlay" id="settings-modal" onclick="closeSettingsOverlay(event)">
            <div class="settings-sheet">
                <div class="sheet-drag-handle"></div>
                <div class="settings-option" onclick="openEditProfile()">
                    <i class="fas fa-user-edit"></i> Edit Profile
                </div>
                <hr style="border:0; border-top:1px solid #e2e8f0; margin:10px 0;">
                <div class="settings-option opt-logout" onclick="logoutAccount()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>
        </div>

        <!-- Edit Profile Panel -->
        <div id="edit-profile-view" class="panel-view">
            <div class="sticky-header" style="justify-content: flex-start; gap: 15px;">
                <button style="background:none; border:none; font-size:1.5rem; font-weight:bold; cursor:pointer;" onclick="showMainProfile()">‹</button>
                <h1 class="header-title">Edit Profile</h1>
            </div>
            <div class="panel-content">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-name-input">
                </div>
                <div class="input-group">
                    <label>Account Role</label>
                    <select id="edit-role-input">
                        <option value="Teacher">Teacher</option>
                        <option value="Student">Student</option>
                    </select>
                </div>
                <button class="btn-save" onclick="saveProfileData()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a href="teacher_dashboard.html" class="nav-item">
            <div class="nav-icon"><i class="fas fa-home"></i></div><span>Home</span>
        </a>
        <a href="teacher_analytics.html" class="nav-item">
            <div class="nav-icon"><i class="fas fa-chart-bar"></i></div><span>Analytics</span>
        </a>
        <a href="teacher_profile.html" class="nav-item active">
            <div class="nav-icon"><i class="far fa-user"></i></div><span>Profile</span>
        </a>
    </div>

    <script>
        window.onload = async () => {
            loadProfileData();
            await fetchTeacherMetrics();
        };

        function loadProfileData() {
            const userName = localStorage.getItem('userName') || "Teacher";
            const userEmail = localStorage.getItem('userEmail') || "teacher@email.com";
            const userRole = localStorage.getItem('userRole') || "Teacher";

            document.getElementById('main-name').innerText = userName;
            document.getElementById('main-email').innerText = userEmail;
            document.getElementById('main-avatar').innerText = userName.charAt(0).toUpperCase();
            document.getElementById('main-role').innerText = `Role: ${userRole}`;

            document.getElementById('edit-name-input').value = userName;
            document.getElementById('edit-role-input').value = userRole;
        }

        async function fetchTeacherMetrics() {
            const userEmail = localStorage.getItem('userEmail');
            if(!userEmail) return;

            try {
                const response = await fetch('/api/teacher-full-analytics', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('stat-attempts').innerText = data.overall.attempts;
                    document.getElementById('stat-students').innerText = data.overall.students;
                    document.getElementById('stat-avg').innerText = data.overall.avg + '%';
                    document.getElementById('stat-exams').innerText = data.overall.exams;

                    const listContainer = document.getElementById('teacher-exams-manage-list');
                    if(data.examStats.length > 0) {
                        listContainer.innerHTML = '';
                        data.examStats.forEach(ex => {
                            listContainer.innerHTML += `
                            <div class="exam-manage-card">
                                <div>
                                    <strong style="display:block; font-size:0.95rem; color:#0f172a;">${ex.name}</strong>
                                    <span style="font-size:0.75rem; color:#64748b;">Code: ${ex.code}</span>
                                </div>
                                <div class="btn-action-group">
                                    <button class="btn-edit" onclick="window.location.href='teacher_analytics.html?code=${ex.code}'">Edit/View</button>
                                    <button class="btn-delete" onclick="deleteExam('${ex.code}')">Delete</button>
                                </div>
                            </div>`;
                        });
                    } else {
                        listContainer.innerHTML = `<p style="color:#64748b; text-align:center;">No exams found.</p>`;
                    }
                }
            } catch(e) { console.log("Error loading teacher profile stats"); }
        }

        async function deleteExam(examCode) {
            if(confirm("Are you sure you want to delete this exam?")) {
                try {
                    const response = await fetch('/api/teacher-delete-exam', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ exam_code: examCode })
                    });
                    const data = await response.json();
                    if(data.success) {
                        alert("Exam deleted successfully!");
                        window.location.reload();
                    } else { alert("Failed to delete."); }
                } catch(e) { alert("Server error."); }
            }
        }

        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettingsOverlay(e) { if(e.target.id === 'settings-modal') { document.getElementById('settings-modal').style.display = 'none'; } }
        
        function openEditProfile() {
            document.getElementById('settings-modal').style.display = 'none';
            document.getElementById('main-profile-view').style.display = 'none';
            document.getElementById('edit-profile-view').style.display = 'block';
        }

        function showMainProfile() {
            document.getElementById('edit-profile-view').style.display = 'none';
            document.getElementById('main-profile-view').style.display = 'block';
        }

        async function saveProfileData() {
            const newName = document.getElementById('edit-name-input').value.trim();
            const newRole = document.getElementById('edit-role-input').value;
            const userEmail = localStorage.getItem('userEmail');
            const oldRole = localStorage.getItem('userRole');

            if(!newName) { alert("Name cannot be empty!"); return; }

            try {
                const response = await fetch('/api/update-profile', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, name: newName, role: newRole })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('userName', newName);
                    localStorage.setItem('userRole', newRole);
                    alert("Profile updated successfully!");
                    if (newRole !== oldRole && newRole === 'Student') {
                        window.location.href = '/student_dashboard.html';
                    } else {
                        showMainProfile();
                        loadProfileData();
                    }
                } else { alert("Failed to update profile."); }
            } catch(e) { alert("Server error."); }
        }

        function logoutAccount() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userName');
                localStorage.removeItem('userRole');
                window.location.href = '/logout';
            }
        }
    </script>
</body>
</html>
